<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Alchemical Void Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151b2b" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Burnished Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae29c" />
      <stop offset="35%" stop-color="#dfb15b" />
      <stop offset="70%" stop-color="#b68326" />
      <stop offset="100%" stop-color="#dfb15b" />
    </linearGradient>

    <!-- Celestial Cyan Arc Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Alchemical Astrolabe Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6" />

  <!-- Cardinal Astral Dots -->
  <circle cx="256" cy="46" r="5" fill="#fae29c" />
  <circle cx="256" cy="466" r="5" fill="#fae29c" />
  <circle cx="46" cy="256" r="5" fill="#fae29c" />
  <circle cx="466" cy="256" r="5" fill="#fae29c" />

  <!-- Central Polyhedral D20 Alchemical Core -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- Equilateral Geometric Triangles -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="#0d1424" stroke="url(#goldGrad)" stroke-width="4" />
    <polygon points="0,-120 70,0 0,60 -70,0" fill="#131c31" stroke="url(#goldGrad)" stroke-width="2.5" />
    <polygon points="0,-120 104,-60 70,0" fill="#192540" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="104,-60 104,60 70,0" fill="#151e33" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="104,60 0,120 0,60" fill="#101728" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="0,120 -104,60 -70,0" fill="#0e1422" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="-104,60 -104,-60 -70,0" fill="#151f35" stroke="url(#goldGrad)" stroke-width="2" />
    <polygon points="-104,-60 0,-120 -70,0" fill="#1c2847" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Quantum Entropy Singularity (Center) -->
    <circle cx="0" cy="0" r="14" fill="url(#cyanGrad)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    
    <!-- 8-Pointed Starburst -->
    <path d="M 0,-36 L 4,-12 L 28,-12 L 8,4 L 16,28 L 0,12 L -16,28 L -8,4 L -28,-12 L -4,-12 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>

  <!-- Constellation Ambient Sparkles -->
  <circle cx="160" cy="140" r="3" fill="#38bdf8" opacity="0.75" />
  <circle cx="360" cy="150" r="2.5" fill="#fae29c" opacity="0.8" />
  <circle cx="370" cy="350" r="3.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="140" cy="360" r="2.5" fill="#fae29c" opacity="0.75" />
</svg>
